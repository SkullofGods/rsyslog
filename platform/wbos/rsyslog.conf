# =============================================================================
# rsyslog main configuration — WBOS / mycelium switch image
# =============================================================================
# Goal: receive the RFC 5424 structured log stream emitted by the WBOS daemons
# (asic_manager, config_manager, route_manager, route_server, flow_manager) on
# the local /dev/log socket, and store/forward it WITHOUT losing the RFC 5424
# framing or the `[wbos@<PEN> ...]` structured-data element.
#
# The daemons write fully-formed RFC 5424 frames to /dev/log (see each repo's
# async_log.hpp / Rfc5424Formatter). For that to survive, imuxsock must hand the
# raw datagram to the regular parser chain (UseSpecialParser="off") and the
# ruleset must try the RFC 5424 parser BEFORE the legacy RFC 3164 one.
#
# Per-service routing and the RFC 5424 on-disk template live in the drop-in
# /etc/rsyslog.d/10-wbos-structured.conf so the receiving policy can be updated
# independently of this base file.
# =============================================================================

#### MODULES ####

# Local system logging via /dev/log (logger, libc syslog(), and the WBOS
# RFC 5424 daemons). UseSpecialParser="off" disables imuxsock's built-in
# legacy parsing so the message reaches the parser chain below — that is what
# lets a `<PRI>1 ...` RFC 5424 frame be recognised as such.
module(load="imuxsock"
       SysSock.UseSpecialParser="off"
       SysSock.Annotate="off"
       SysSock.UseSysTimeStamp="on")

# Kernel logging.
module(load="imklog")

# Explode the RFC 5424 SD element into message properties ($!rfc5424-sd!...)
# so wbos@<PEN> fields (commit, stage, action, result, op, seq, ...) become
# addressable for filtering/forwarding. Cheap and optional — used by the
# drop-in. Comment out if mmpstrucdata is not built into the image.
module(load="mmpstrucdata")

#### GLOBAL DIRECTIVES ####

global(workDirectory="/var/lib/rsyslog")

# Default on-disk format for everything is RFC 5424 (protocol-23). This keeps
# even non-WBOS local messages in a single, machine-parsable shape.
module(load="builtin:omfile" Template="RSYSLOG_SyslogProtocol23Format")

# Try RFC 5424 first, fall back to legacy RFC 3164 for anything that is not a
# clean protocol-23 frame (e.g. plain `logger` output). This is the parser
# order applied to messages coming in through imuxsock.
$RulesetParser rsyslog.rfc5424
$RulesetParser rsyslog.rfc3164

# Pull in the WBOS routing rules and any other drop-ins.
$IncludeConfig /etc/rsyslog.d/*.conf

#### RULES ####
# Catch-all for local (non-WBOS) messages; WBOS app-names are split out in the
# drop-in, which stops further processing for them.
*.info                                          /var/log/messages
*.emerg                                         :omusrmsg:*
