# =============================================================================
# 10-wbos-structured.conf — routing for the WBOS RFC 5424 log stream
# =============================================================================
# Installed as /etc/rsyslog.d/10-wbos-structured.conf. Depends on the base
# config having loaded imuxsock with UseSpecialParser="off" and a parser chain
# that tries rsyslog.rfc5424 first (see platform/wbos/rsyslog.conf).
#
# Each WBOS daemon emits RFC 5424 with APP-NAME == its service name and a
# `[wbos@<PEN> ...]` SD element. We:
#   * keep messages in RFC 5424 on disk (SD preserved),
#   * split them into one file per service plus a combined wbos.log,
#   * stop further processing so WBOS traffic does not also land in
#     /var/log/messages.
# =============================================================================

# RFC 5424 on-disk template. STRUCTURED-DATA carries the [wbos@<PEN> ...]
# element verbatim; if absent the parser yields "-" (a valid NILVALUE).
template(name="wbosRFC5424" type="list") {
    constant(value="<")
    property(name="pri")
    constant(value=">1 ")
    property(name="timestamp" dateFormat="rfc3339")
    constant(value=" ")
    property(name="hostname")
    constant(value=" ")
    property(name="app-name")
    constant(value=" ")
    property(name="procid")
    constant(value=" ")
    property(name="msgid")
    constant(value=" ")
    property(name="structured-data")
    constant(value=" ")
    property(name="msg" droplastlf="on")
    constant(value="\n")
}

# Optional: explode the SD element into $!rfc5424-sd!wbos@<PEN>!<field> so the
# structured fields can be used in filters/forwarding below. Harmless if the
# message has no SD. Remove this line if mmpstrucdata is not in the image.
action(type="mmpstrucdata")

# --- per-service split -------------------------------------------------------
# CreateDirs is on by default, so /var/log/wbos/ is created on first write.
# The "wbos-asic"/"wbos-config" forms are legacy syslog idents kept as a
# safety net for older binaries; current builds use the underscore names.
if ($app-name == "asic_manager"   or $app-name == "wbos-asic")   then { action(type="omfile" file="/var/log/wbos/asic_manager.log"   template="wbosRFC5424") }
if ($app-name == "config_manager" or $app-name == "wbos-config") then { action(type="omfile" file="/var/log/wbos/config_manager.log" template="wbosRFC5424") }
if ($app-name == "route_manager")  then { action(type="omfile" file="/var/log/wbos/route_manager.log"  template="wbosRFC5424") }
if ($app-name == "route_server")   then { action(type="omfile" file="/var/log/wbos/route_server.log"   template="wbosRFC5424") }
if ($app-name == "flow_manager")   then { action(type="omfile" file="/var/log/wbos/flow_manager.log"   template="wbosRFC5424") }

# --- combined WBOS stream + stop --------------------------------------------
if ($app-name == "asic_manager"   or $app-name == "wbos-asic"   or
    $app-name == "config_manager" or $app-name == "wbos-config" or
    $app-name == "route_manager"  or
    $app-name == "route_server"   or
    $app-name == "flow_manager") then {
    action(type="omfile" file="/var/log/wbos/wbos.log" template="wbosRFC5424")

    # --- optional remote collector (disabled by default) --------------------
    # Forward the WBOS stream in RFC 5424 over TCP to a central collector with
    # a disk-assisted queue so nothing is lost while the collector is down.
    # Uncomment and set the target to enable.
    #action(type="omfwd"
    #       target="logcollector.mycelium.local" port="514" protocol="tcp"
    #       template="wbosRFC5424"
    #       queue.type="linkedList"
    #       queue.filename="wbos_fwd"
    #       queue.maxDiskSpace="1g"
    #       queue.saveOnShutdown="on"
    #       action.resumeRetryCount="-1")

    stop
}
